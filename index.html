var KB=[['what is business|business is|define business|meaning of business','A business is an organisation that makes or sells goods or services to earn a profit.'],['what is commerce|commerce is','Commerce is all activities that help goods move from producers to consumers, such as trade, banking, insurance, transport, warehousing and advertising.'],['what is economics|economics is','Economics studies how people, businesses and governments use limited resources to meet unlimited wants.'],['what is accounting|accounting is','Accounting is recording, summarising and reporting the financial transactions of a business.'],['what is finance|finance is','Finance is the management of money, including saving, borrowing, lending, investing and budgeting.'],['what is statistics|statistics is','Statistics is collecting, organising, analysing and interpreting numerical data.'],['what is mathematics|what is maths','Mathematics is the study of numbers, quantities, shapes and patterns, and how they relate.'],['units in education|common units|bed units|degree units|education units','Common BEd units: Introduction to Education, Educational Psychology, Sociology of Education, Philosophy of Education, History of Education, Curriculum Development, Instructional Methods, Educational Technology, Guidance and Counselling, Special Needs Education, Educational Administration, Measurement and Evaluation, Research Methods and Teaching Practice. Names vary by university.'],['sociology','Sociology is the study of society, groups and social relationships. Sociology of education studies how schools and society influence each other, including class, gender, culture and socialisation.'],['philosophy of education|what is philosophy','Philosophy of education studies the aims and values of education. Main schools: idealism (ideas and values), realism (facts and science), pragmatism (learning by doing), existentialism (individual choice) and perennialism (timeless knowledge).'],['history of education',' esson plan is for one lesson.'],['professional records|records of work','Teachers keep professional records: schemes of work, lesson plans, records of work covered, class registers and mark books.'],['teaching methods|methods of teaching|lecture method|discussion method','Common teaching methods: lecture, discussion, demonstration, question and answer, group work, role play, project and field trips. Choose by the objective and the learners.'],['teaching aids|instructional materials|teaching and learning resources','Teaching aids are materials like charts, models, real objects, textbooks and videos that make lessons clearer.'],['learning outcomes|learning objectives','Learning objectives state what a learner should be able to do at the end of a lesson. Good objectives are specific and measurable.'],['child development|human development','Child development studies how children grow physically, mentally, socially and emotionally from birth to adulthood.'],['ecde|early childhood','ECDE is Early Childhood Development Education, for young children before primary school, focusing on play and basic skills.'],['learning theories','Main learning theories: behaviourism (Pavlov, Skinner), cognitivism (Piaget), constructivism (Vygotsky) and social learning (Bandura).'],['andragogy','Andragogy is the method and practice of teaching adults.'],['what is education|education is','Education is the process of gaining knowledge, skills, values and attitudes, in school and outside it.'],['algebra','Algebra uses letters for unknown numbers to form and solve equations, for example x + 5 = 12 gives x = 7.'],['calculus|derivative|differentiation','Differentiation finds the rate of change or gradient. For y = x to the power n, dy/dx = n times x to the power (n-1).'],['integration|integral','Integration is the reverse of differentiation. The integral of x to the power n is x to the power (n+1) divided by (n+1), plus a constant C.'],['matrix|matrices','A matrix is a rectangular array of numbers. Multiply rows by columns. For a 2 by 2 matrix [a b; c d], the determinant is ad minus bc.'],['vector','A vector has both magnitude and direction, unlike a scalar which has only size.'],['arithmetic progression|geometric progression|sequence and series','Arithmetic progression: nth term = a + (n-1)d and sum = n/2 times (2a + (n-1)d). Geometric progression: nth term = a times r to the power (n-1) and sum = a(r to the power n minus 1) divided by (r minus 1).'],['logarithm','Logarithm laws: log(ab) = log a + log b, log(a/b) = log a - log b, and log(a to the power n) = n log a.'],['indices|laws of indices','Laws of indices: a^m times a^n = a^(m+n), a^m divided by a^n = a^(m-n), (a^m)^n = a^(mn), and a^0 = 1.'],['trigonometry|sohcahtoa|sine|cosine','In a right angled triangle: sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent (SOH CAH TOA).'],['standard deviation|variance','Standard deviation measures how spread out data is around the mean. Variance is the standard deviation squared.'],['set theory|venn','Sets are collections of items. Union means in either set, intersection means in both. A Venn diagram shows how sets overlap.'],['surd','A surd is a root that cannot be written as an exact fraction, like the square root of 2.'],['linear programming','Linear programming finds the best value (maximum or minimum) of an expression subject to linear inequalities, often solved on a graph.'],['simultaneous equation','Solve simultaneous equations by elimination or substitution to find the values that satisfy both equations.'],['gradient|slope','Gradient is the steepness of a line: change in y divided by change in x.'],['permutation|combination|factorial','A permutation counts arrangements where order matters: nPr = n!/(n-r)!. A combination counts selections where order does not matter: nCr = n!/(r!(n-r)!).'],['physical geography|human geography|what is geography','Geography studies the Earth. Physical geography covers landforms, climate, soils and water. Human geography covers people, population, settlement and economic activities.'],['plate tectonic','Earths crust is split into plates that move slowly. Their movement causes earthquakes, volcanoes, mountains and rift valleys.'],['igneous|sedimentary|metamorphic|types of rock','Three rock types: igneous (cooled magma or lava), sedimentary (layers of compressed sediments) and metamorphic (changed by heat and pressure).'],['weathering|erosion','Weathering breaks rocks down where they are. Erosion carries the broken material away by water, wind or ice.'],['rift valley','The Great Rift Valley was formed by tectonic forces pulling the crust apart, causing faulting and the sinking of land between faults. It passes through Kenya.'],['weather and climate|climate vs weather','Weather is the short term condition of the atmosphere. Climate is the average weather over about 30 years.'],['latitude|longitude','Latitude lines run east to west and measure distance north or south of the Equator (0 degrees). Longitude lines run north to south and measure distance east or west of the Prime Meridian (0 degrees).'],['map scale|scale of a map|map reading','Map scale shows how map distance relates to real distance, for example 1:50,000 means 1 cm on the map is 50,000 cm (500 m) on the ground.'],['contour','Contour lines join places of equal height. Lines close together show steep slopes, and lines far apart show gentle slopes.'],['population density','Population density is the number of people per square kilometre: population divided by area.'],['urbanisation|urbanization','Urbanisation is the growth of towns and cities as more people move from rural to urban areas.'],['subsistence|commercial farming|types of farming','Subsistence farming produces food mainly for the family. Commercial farming produces crops or animals mainly for sale.'],['volcano','A volcano is an opening in the crust where magma, ash and gases erupt. Mount Kenya is an extinct volcano.'],['earthquake','An earthquake is shaking of the ground caused by sudden movement of rocks along faults.'],['gis|remote sensing','GIS is a computer system for capturing, storing and analysing map data. Remote sensing collects information about Earth from satellites or aircraft.'],['demand and supply|law of demand|law of supply','Law of demand: when price rises, quantity demanded falls. Law of supply: when price rises, quantity supplied rises. Price settles where they meet (equilibrium).'],['elasticity','Price elasticity of demand measures how much demand changes when price changes. It is the percentage change in quantity divided by the percentage change in price.'],['opportunity cost','Opportunity cost is the value of the next best option you give up when you make a choice.'],['gdp|gross domestic','GDP (Gross Domestic Product) is the total value of goods and services produced in a country in a period, usually a year.'],['inflation','Inflation is a general rise in prices over time, which reduces what money can buy.'],['monopoly','A monopoly is a market with only one seller, who can control price and supply.'],['marketing mix|4ps|four ps','The marketing mix has four Ps: Product, Price, Place and Promotion.'],['what is marketing','Marketing is identifying and satisfying customer needs profitably, through research, product, pricing, promotion and distribution.'],['swot','SWOT analysis lists Strengths and Weaknesses (inside the business) and Opportunities and Threats (outside).'],['functions of management|management functions|what is management','The main functions of management are planning, organising, leading (directing) and controlling.'],['accounting equation','Assets = Liabilities + Owners equity (capital).'],['balance sheet|statement of financial position','A balance sheet shows a business assets, liabilities and owners equity at a specific date.'],['income statement|profit and loss','An income statement shows revenue minus expenses over a period, giving profit or loss.'],['double entry','Double entry bookkeeping records every transaction twice: a debit in one account and a credit in another, of equal value.'],['depreciation','Depreciation spreads the cost of a fixed asset over its useful life, as it wears out or becomes old.'],['break even|breakeven','Break-even point is the sales level where total revenue equals total costs, so there is no profit or loss. Break-even units = fixed costs divided by (price minus variable cost per unit).'],['profit margin','Profit margin = (profit divided by revenue) x 100.'],['liquidity','Liquidity is how easily a business can pay short term debts using cash or assets that quickly turn into cash.'],['return on investment|\\broi\\b','ROI = (gain from investment minus cost) divided by cost, x 100.'],['what is entrepreneurship|entrepreneur is|define entrepreneur','An entrepreneur starts and runs a business, taking risks to turn an idea into profit. Entrepreneurship is the process of doing this.'],['supply chain','A supply chain is all the steps that move a product from raw materials and suppliers to the final customer.'],['human resource management|what is hrm','Human resource management is recruiting, training, rewarding and looking after the people who work in an organisation.'],['what is a budget|budgeting|what is budget','A budget is a plan of expected income and spending over a period, used to control money.'],['capital of kenya|mji mkuu wa kenya','Nairobi is the capital of Kenya.','Mji mkuu wa Kenya ni Nairobi.'],['photosynthesis|usanisinuru','Photosynthesis is how plants use sunlight, water and carbon dioxide to make food (glucose) and release oxygen.','Usanisinuru ni mchakato ambao mimea hutumia mwanga wa jua, maji na kaboni dioksidi kutengeneza chakula (glukosi) na kutoa oksijeni.'],['gravity|uvutano','Gravity is the force that pulls objects toward each other. On Earth it pulls things down at about 9.8 metres per second every second.','Uvutano ni nguvu inayovuta vitu kuelekeana. Hapa duniani huvuta vitu chini kwa tak
